<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>G&Ecirc;NIOS DO JOGO — Entrar</title>
  <meta name="description" content="Plataforma de jogos educativos de exatas para o Ensino Fundamental." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=11" />
  <style>
    body { justify-content: center; }
    .login-main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
    .login-card { width: 100%; max-width: 460px; text-align: center; }
    .login-mark { width: 76px; height: 76px; margin: 0 auto 18px; border-radius: 24px; background: linear-gradient(135deg, var(--color-primary), var(--color-primary-light)); display: flex; align-items: center; justify-content: center; font-size: 2.2rem; box-shadow: var(--shadow-md); }
  </style>
</head>
<body class="login-page">

  <main class="login-main">
    <div class="card login-card">
      <div class="login-mark" aria-hidden="true">🧮</div>
      <span class="eyebrow">Bem-vindo(a), explorador(a)!</span>
      <h1>Vamos jogar?</h1>
      <p>Escolha seu tipo de acesso e entre na aventura.</p>

      <div class="login-switch" id="accountTypeSwitch" role="group" aria-label="Tipo de acesso">
        <button type="button" class="login-switch__button is-active" data-account-type="school" aria-pressed="true">Da escola</button>
        <button type="button" class="login-switch__button" data-account-type="outside" aria-pressed="false">De fora</button>
      </div>
      <p class="login-note" id="accountTypeDescription">Use o e-mail fornecido pela escola.</p>

      <div class="login-switch login-switch--compact" id="authModeSwitch" role="group" aria-label="Ação da conta">
        <button type="button" class="login-switch__button" data-auth-mode="login" aria-pressed="false">Entrar</button>
        <button type="button" class="login-switch__button is-active" data-auth-mode="register" aria-pressed="true">Criar perfil</button>
      </div>

      <form id="playerLoginForm" autocomplete="on">
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="voce@escola.com" autocomplete="username" required />
        </div>

        <div class="field register-only" id="nameField">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" placeholder="Como podemos chamar você?" autocomplete="name" />
        </div>

        <div class="field">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" placeholder="Mínimo de 6 caracteres" minlength="6" autocomplete="current-password" required />
        </div>

        <div class="field register-only school-only" id="classField">
          <label for="turma">Qual é a sua turma?</label>
          <select id="turma" name="turma">
            <option value="" disabled selected>Selecione a sua turma</option>
            <option value="1º ano">1º ano</option>
            <option value="2º ano">2º ano</option>
            <option value="3º ano">3º ano</option>
            <option value="4º ano">4º ano</option>
            <option value="5º ano">5º ano</option>
          </select>
        </div>

        <div class="field register-only" id="avatarField">
          <label>Escolha seu avatar</label>
          <div class="avatar-picker" role="radiogroup" aria-label="Avatar">
            <label class="avatar-option selected">
              <input type="radio" name="avatar" value="🦊" checked hidden /><span class="avatar-option__emoji" aria-hidden="true">🦊</span>
            </label>
            <label class="avatar-option">
              <input type="radio" name="avatar" value="🐱" hidden /><span class="avatar-option__emoji" aria-hidden="true">🐱</span>
            </label>
            <label class="avatar-option">
              <input type="radio" name="avatar" value="🦉" hidden /><span class="avatar-option__emoji" aria-hidden="true">🦉</span>
            </label>
            <label class="avatar-option">
              <input type="radio" name="avatar" value="🦕" hidden /><span class="avatar-option__emoji" aria-hidden="true">🦕</span>
            </label>
            <label class="avatar-option">
              <input type="radio" name="avatar" value="🦄" hidden /><span class="avatar-option__emoji" aria-hidden="true">🦄</span>
            </label>
            <label class="avatar-option">
              <input type="radio" name="avatar" value="🤖" hidden /><span class="avatar-option__emoji" aria-hidden="true">🤖</span>
            </label>
          </div>
        </div>

        <p class="form-feedback" id="loginFeedback" role="alert" hidden></p>
        <button type="submit" class="btn btn--primary btn--block" id="loginSubmit">Criar perfil e jogar</button>
      </form>

      <p class="hint login-device-note">Perfis são salvos neste dispositivo.</p>

      <p class="hint" style="margin-top:18px;">
        É professor(a)? <a href="professor.html" style="color: var(--color-primary-dark); font-weight:700;">Área do professor</a>
      </p>
    </div>
  </main>

  <footer class="footer">G&Ecirc;NIOS DO JOGO · Plataforma de Jogos Educativos de Exatas</footer>

  <script src="js/app-state.js?v=5"></script>
  <script src="js/nav.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('playerLoginForm');
      const avatarInputs = document.querySelectorAll('input[name="avatar"]');
      const accountTypeButtons = document.querySelectorAll('[data-account-type]');
      const authModeButtons = document.querySelectorAll('[data-auth-mode]');
      const accountTypeDescription = document.getElementById('accountTypeDescription');
      const loginFeedback = document.getElementById('loginFeedback');
      const loginSubmit = document.getElementById('loginSubmit');
      const nomeInput = document.getElementById('nome');
      const emailInput = document.getElementById('email');
      const senhaInput = document.getElementById('senha');
      const turmaInput = document.getElementById('turma');
      const nameField = document.getElementById('nameField');
      const classField = document.getElementById('classField');
      const avatarField = document.getElementById('avatarField');
      let accountType = 'school';
      let authMode = 'register';

      const showFeedback = (message) => {
        loginFeedback.textContent = message;
        loginFeedback.hidden = !message;
      };

      const updateFormMode = () => {
        const isRegistering = authMode === 'register';
        const needsClass = isRegistering && accountType === 'school';
        nameField.hidden = !isRegistering;
        avatarField.hidden = !isRegistering;
        classField.hidden = !needsClass;
        nomeInput.required = isRegistering;
        turmaInput.required = needsClass;
        senhaInput.autocomplete = isRegistering ? 'new-password' : 'current-password';
        accountTypeDescription.textContent = accountType === 'school'
          ? 'Use o e-mail fornecido pela escola.'
          : 'Use seu e-mail pessoal. Seu perfil fica salvo neste dispositivo.';
        loginSubmit.textContent = isRegistering
          ? accountType === 'school' ? 'Criar perfil escolar' : 'Criar perfil de visitante'
          : 'Entrar e jogar';
        accountTypeButtons.forEach((button) => {
          const selected = button.dataset.accountType === accountType;
          button.classList.toggle('is-active', selected);
          button.setAttribute('aria-pressed', String(selected));
        });
        authModeButtons.forEach((button) => {
          const selected = button.dataset.authMode === authMode;
          button.classList.toggle('is-active', selected);
          button.setAttribute('aria-pressed', String(selected));
        });
        showFeedback('');
      };

      accountTypeButtons.forEach((button) => {
        button.addEventListener('click', () => {
          accountType = button.dataset.accountType;
          updateFormMode();
        });
      });

      authModeButtons.forEach((button) => {
        button.addEventListener('click', () => {
          authMode = button.dataset.authMode;
          updateFormMode();
        });
      });

      avatarInputs.forEach((input) => {
        input.addEventListener('change', () => {
          document.querySelectorAll('.avatar-option').forEach((option) => option.classList.remove('selected'));
          input.closest('.avatar-option').classList.add('selected');
        });
      });

      form.addEventListener('submit', (event) => {
        event.preventDefault();

        const nome = nomeInput.value.trim();
        const email = emailInput.value.trim().toLowerCase();
        const senha = senhaInput.value.trim();
        const turma = turmaInput.value.trim();
        const avatar = document.querySelector('input[name="avatar"]:checked')?.value || '🦊';
        const isRegistering = authMode === 'register';

        if (!email || !senha || (isRegistering && !nome) || (isRegistering && accountType === 'school' && !turma)) {
          showFeedback('Preencha os campos obrigatórios para continuar.');
          return;
        }

        if (senha.length < 6) {
          showFeedback('A senha precisa ter pelo menos 6 caracteres.');
          return;
        }

        const result = isRegistering
          ? window.GeniosApp.registerUser({
              nome,
              email,
              password: senha,
              turma: accountType === 'school' ? turma : 'Visitante',
              avatar,
              accountType,
            })
          : window.GeniosApp.loginUser({ email, password: senha, accountType });

        if (!result.ok) {
          showFeedback(result.message || 'Não foi possível entrar no jogo.');
          return;
        }

        window.GeniosApp.setPlayer({ ...result.profile, lastPlayed: new Date().toISOString() });
        window.location.href = 'materias.html';
      });

      updateFormMode();
    });
  </script>
</body>
</html>
