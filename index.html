<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exatas Play — Entrar</title>
  <meta name="description" content="Plataforma de jogos educativos de exatas para o Ensino Fundamental." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { justify-content: center; }
    .login-main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
    .login-card { width: 100%; max-width: 460px; text-align: center; }
    .login-mark { width: 76px; height: 76px; margin: 0 auto 18px; border-radius: 24px; background: linear-gradient(135deg, var(--color-primary), var(--color-primary-light)); display: flex; align-items: center; justify-content: center; font-size: 2.2rem; box-shadow: var(--shadow-md); }
  </style>
</head>
<body>

  <main class="login-main">
    <div class="card login-card">
      <div class="login-mark" aria-hidden="true">🧮</div>
      <span class="eyebrow">Bem-vindo(a)!</span>
      <h1>Exatas Play</h1>
      <p>Digite seu nome, escolha sua turma e um avatar para começar a jogar e aprender!</p>

      <form action="materias.html" autocomplete="off">
        <div class="field">
          <label for="nome">Como você se chama?</label>
          <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required />
        </div>

        <div class="field">
          <label for="turma">Qual é a sua turma?</label>
          <select id="turma" name="turma" required>
            <option value="" disabled selected>Selecione a sua turma</option>
            <option value="1ano">1º ano</option>
            <option value="2ano">2º ano</option>
            <option value="3ano">3º ano</option>
            <option value="4ano">4º ano</option>
            <option value="5ano">5º ano</option>
          </select>
        </div>

        <div class="field">
          <label>Escolha seu avatar</label>
          <div class="avatar-picker" role="radiogroup" aria-label="Avatar">
            <label class="avatar-option selected">
              <input type="radio" name="avatar" value="fox" checked hidden />🦊
            </label>
            <label class="avatar-option">
              <input type="radio" name="avatar" value="cat" hidden />🐱
            </label>
            <label class="avatar-option">
              <input type="radio" name="avatar" value="owl" hidden />🦉
            </label>
            <label class="avatar-option">
              <input type="radio" name="avatar" value="dino" hidden />🦕
            </label>
            <label class="avatar-option">
              <input type="radio" name="avatar" value="unicorn" hidden />🦄
            </label>
            <label class="avatar-option">
              <input type="radio" name="avatar" value="robot" hidden />🤖
            </label>
          </div>
        </div>

        <button type="submit" class="btn btn--primary btn--block">Entrar e jogar 🚀</button>
      </form>

      <p class="hint" style="margin-top:18px;">
        É professor(a)? <a href="professor.html" style="color: var(--color-primary-dark); font-weight:700;">Acesse o painel do professor</a>
      </p>
    </div>
  </main>

  <footer class="footer">Exatas Play · Plataforma de Jogos Educativos de Exatas (nome provisório)</footer>

  <script src="js/nav.js"></script>
</body>
</html>
