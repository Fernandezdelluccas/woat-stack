<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>G&Ecirc;NIOS DO JOGO — Entrar</title>
  <meta name="description" content="Plataforma de jogos educativos de exatas para o Ensino Fundamental." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body { justify-content: center; }
    .login-main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
    .login-card { width: 100%; max-width: 460px; text-align: center; }
    .login-mark { width: 76px; height: 76px; margin: 0 auto 18px; border-radius: 24px; background: linear-gradient(135deg, var(--color-primary), var(--color-primary-light)); display: flex; align-items: center; justify-content: center; font-size: 2.2rem; box-shadow: var(--shadow-md); }
  </style>
</head>
<body>

  <main class="login-main">
    <div class="card login-card">
      <div class="login-mark" aria-hidden="true">🧮</div>
      <span class="eyebrow">Bem-vindo(a)!</span>
      <h1>G&Ecirc;NIOS DO JOGO</h1>
      <p>Digite seu nome, escolha sua turma e um avatar para começar a jogar e aprender!</p>

      <form id="playerLoginForm" autocomplete="off">
        <div class="field">
          <label for="nome">Como você se chama?</label>
          <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required />
        </div>

        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="seuemail@escola.com" required />
        </div>

        <div class="field">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" placeholder="Crie uma senha segura" minlength="6" required />
        </div>

        <div class="field">
          <label for="turma">Qual é a sua turma?</label>
          <select id="turma" name="turma" required>
            <option value="" disabled selected>Selecione a sua turma</option>
            <option value="1º ano">1º ano</option>
            <option value="2º ano">2º ano</option>
            <option value="3º ano">3º ano</option>
            <option value="4º ano">4º ano</option>
            <option value="5º ano">5º ano</option>
          </select>
        </div>

        <div class="field">
          <label>Escolha seu avatar</label>
          <div class="avatar-picker" role="radiogroup" aria-label="Avatar">
            <label class="avatar-option selected">
              <input type="radio" name="avatar" value="🦊" checked hidden />🦊
            </label>
            <label class="avatar-option">
              <input type="radio" name="avatar" value="🐱" hidden />🐱
            </label>
            <label class="avatar-option">
              <input type="radio" name="avatar" value="🦉" hidden />🦉
            </label>
            <label class="avatar-option">
              <input type="radio" name="avatar" value="🦕" hidden />🦕
            </label>
            <label class="avatar-option">
              <input type="radio" name="avatar" value="🦄" hidden />🦄
            </label>
            <label class="avatar-option">
              <input type="radio" name="avatar" value="🤖" hidden />🤖
            </label>
          </div>
        </div>

        <button type="submit" class="btn btn--primary btn--block">Entrar e jogar 🚀</button>
      </form>

      <p class="hint" style="margin-top:18px;">
        É professor(a)? <a href="professor.html" style="color: var(--color-primary-dark); font-weight:700;">Área do professor</a>
      </p>
    </div>
  </main>

  <footer class="footer">G&Ecirc;NIOS DO JOGO · Plataforma de Jogos Educativos de Exatas</footer>

  <script src="js/app-state.js?v=4"></script>
  <script src="js/nav.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('playerLoginForm');
      const avatarInputs = document.querySelectorAll('input[name="avatar"]');
      const nomeInput = document.getElementById('nome');
      const emailInput = document.getElementById('email');
      const senhaInput = document.getElementById('senha');
      const turmaInput = document.getElementById('turma');

      avatarInputs.forEach((input) => {
        input.addEventListener('change', () => {
          document.querySelectorAll('.avatar-option').forEach((option) => option.classList.remove('selected'));
          input.closest('.avatar-option').classList.add('selected');
        });
      });

      form.addEventListener('submit', (event) => {
        event.preventDefault();

        const nome = nomeInput.value.trim();
        const email = emailInput.value.trim();
        const senha = senhaInput.value.trim();
        const turma = turmaInput.value.trim();
        const avatar = document.querySelector('input[name="avatar"]:checked')?.value || '🦊';

        if (!nome || !email || !senha || !turma) {
          window.alert('Preencha todos os campos para entrar.');
          return;
        }

        if (senha.length < 6) {
          window.alert('A senha precisa ter pelo menos 6 caracteres.');
          return;
        }

        const existing = window.GeniosApp.getPlayer();
        const result = existing && existing.email && existing.email.toLowerCase() === email.toLowerCase()
          ? window.GeniosApp.loginUser({ email, password: senha })
          : window.GeniosApp.registerUser({ nome, email, password: senha, turma, avatar });

        if (!result.ok) {
          window.alert(result.message || 'Não foi possível entrar no jogo.');
          return;
        }

        window.GeniosApp.setPlayer({ ...result.profile, avatar, turma, lastPlayed: new Date().toISOString() });
        window.location.href = 'materias.html';
      });
    });
  </script>
</body>
</html>
