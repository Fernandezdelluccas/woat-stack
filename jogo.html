<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>G&Ecirc;NIOS DO JOGO — Jogo de Adição</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=6" />
</head>
<body>

  <header class="topbar">
    <div class="topbar__inner">
      <a href="materias.html" class="brand">
        <span class="brand__mark">🧮</span> G&Ecirc;NIOS DO JOGO
      </a>
      <nav class="nav">
        <a href="materias.html">Matérias</a>
        <a href="ranking.html">Ranking</a>
      </nav>
      <div class="user-chip">
        <span class="user-chip__avatar">🦊</span> Ana
      </div>
    </div>
  </header>

  <main class="main">
    <div class="container game-shell">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; flex-wrap:wrap;">
        <a href="matematica.html" class="hint">← Sair do jogo</a>
        <button type="button" class="btn btn--ghost" id="tutorialButton" style="padding:8px 14px; font-size:0.78rem;">📘 Tutorial</button>
      </div>

      <div class="game-hud">
        <div class="game-hud__item">⭐ <span id="score">0 pts</span></div>
        <div class="game-hud__item">✅ <span id="acertos">0 acertos</span></div>
        <div class="game-hud__item">❌ <span id="erros">0 erros</span></div>
        <div class="game-hud__item">⏱️ <span id="tempo">00:00</span></div>
      </div>

      <div class="progress-bar" style="margin-bottom:24px;">
        <div class="progress-bar__fill" id="progressBar" style="width: 0%;"></div>
      </div>

      <div class="card question-card">
        <span class="eyebrow" id="questionMeta">Pergunta 1 de 10 · Adição</span>
        <div class="question-visual" id="questionVisual" aria-label="Exemplo visual da pergunta"></div>
        <div class="question-card__prompt" id="questionPrompt">Carregando...</div>

        <div class="options-grid" id="optionsGrid"></div>

        <div class="progress-dots" id="progressDots"></div>
      </div>
      <aside class="game-companion" aria-label="Mascote do jogo">
        <span class="game-companion__bubble" id="companionBubble" aria-live="polite">VOCÊ CONSEGUE! LEIA A HISTÓRIA E PENSE COM CALMA.</span>
        <span class="game-companion__avatar" id="gameCompanion" role="img" aria-label="Mascote do jogo">🦊</span>
      </aside>
    </div>
  </main>

  <footer class="footer">G&Ecirc;NIOS DO JOGO · Plataforma de Jogos Educativos de Exatas</footer>

  <script src="js/app-state.js?v=4"></script>
  <script type="module" src="js/game-runner.js?v=8"></script>
  <script src="js/nav.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const player = window.GeniosApp?.getPlayer?.();
      const userChip = document.querySelector('.user-chip');
      const gameCompanion = document.getElementById('gameCompanion');
      if (userChip && player) {
        userChip.innerHTML = `<span class="user-chip__avatar">${player.avatar || '🦊'}</span> ${player.nome}`;
      }
      if (gameCompanion && player) gameCompanion.textContent = player.avatar || '🦊';
    });
  </script>
</body>
</html>
