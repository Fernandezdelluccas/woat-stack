<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>G&Ecirc;NIOS DO JOGO — Ranking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=14" />
</head>
<body>

  <header class="topbar">
    <div class="topbar__inner">
      <a href="materias.html" class="brand">
        <span class="brand__mark">🧮</span> G&Ecirc;NIOS DO JOGO
      </a>
      <nav class="nav">
        <a href="materias.html">Matérias</a>
        <a href="ranking.html">Ranking</a>
      </nav>
      <div class="user-chip">
        <span class="user-chip__avatar">🦊</span> Ana
      </div>
    </div>
  </header>

  <main class="main">
    <div class="container">
      <div class="page-head">
        <span class="eyebrow">Competição amigável</span>
        <h1>Ranking de Matemática</h1>
        <p id="rankingMessage">Ranking interno da turma.</p>
      </div>

      <div class="table-wrap">
        <table class="ranking-table">
          <thead>
            <tr>
              <th>Pos.</th>
              <th>Aluno</th>
              <th>Turma</th>
              <th>Pontos</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="4" class="hint text-center">Carregando ranking da turma...</td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </main>

  <footer class="footer">G&Ecirc;NIOS DO JOGO · Plataforma de Jogos Educativos de Exatas</footer>

  <script src="js/app-state.js?v=9"></script>
  <script src="js/nav.js?v=3"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const player = window.GeniosApp?.getPlayer?.();
      const userChip = document.querySelector('.user-chip');
      if (userChip && player) {
        userChip.innerHTML = `<span class="user-chip__avatar">${player.avatar || '🦊'}</span> ${player.nome}`;
      }

      const rankingBody = document.querySelector('.ranking-table tbody');
      if (!rankingBody) return;

      if (!player || player.accountType !== 'school') {
        rankingBody.innerHTML = '<tr><td colspan="4" class="hint text-center">O ranking é exclusivo para perfis da escola.</td></tr>';
        document.getElementById('rankingMessage').textContent = 'Entre com um perfil escolar para ver a classificação da turma.';
        return;
      }

      const ranking = window.GeniosApp.getRanking();
      rankingBody.innerHTML = '';

      if (ranking.length === 0) {
        rankingBody.innerHTML = '<tr><td colspan="4" class="hint text-center">Sua turma ainda não tem pontuações. Comece uma aventura!</td></tr>';
        return;
      }

      ranking.forEach((playerItem, index) => {
        const row = document.createElement('tr');
        const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `${index + 1}º`;
        const medalClass = index === 0 ? 'rank-pos rank-pos--gold' : index === 1 ? 'rank-pos rank-pos--silver' : index === 2 ? 'rank-pos rank-pos--bronze' : 'rank-pos';

        row.innerHTML = `
          <td class="${medalClass}">${medal}</td>
          <td class="player-cell"><span class="player-cell__avatar">${playerItem.avatar || '🦊'}</span> ${playerItem.name}</td>
          <td>${playerItem.turma || '4º ano'}</td>
          <td>${playerItem.points || 0}</td>
        `;
        rankingBody.appendChild(row);
      });
    });
  </script>
</body>
</html>
